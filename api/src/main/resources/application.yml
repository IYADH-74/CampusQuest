spring:
  application:
    name: campusquest-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campusquest}
    username: ${DATABASE_USERNAME:campusquest}
    password: ${DATABASE_PASSWORD:campusquest}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 64KB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    com.campusquest: INFO

campusquest:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:CampusQuest <no-reply@campusquest.local>}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      issuer: ${JWT_ISSUER:campusquest}
      audience: campusquest-api
      access-token-ttl: 15m
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      allow-ephemeral-keys: ${JWT_ALLOW_EPHEMERAL_KEYS:false}
    refresh-token:
      ttl: 7d
      absolute-ttl: 30d
      cookie-name: cq_refresh
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    verification:
      code-ttl: 15m
      max-attempts: 5
      pepper: ${VERIFICATION_PEPPER:}
    password-reset-ttl: 30m
    invite-ttl: 72h
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:}
  game:
    tier-xp: [2000, 3000, 4000, 5000, 6000]
    level-thresholds: [0, 5000, 10500, 16500, 23000, 30000, 37500, 45500, 54500, 64500, 75500,
                       87500, 101000, 116000, 132500, 150500, 170000, 191000, 213500, 237500, 263500]
    challenge-slots:
      - { min-level: 0, slots: 1 }
      - { min-level: 5, slots: 2 }
      - { min-level: 8, slots: 3 }
      - { min-level: 10, slots: 4 }
      - { min-level: 12, slots: 5 }
      - { min-level: 14, slots: 6 }
      - { min-level: 16, slots: 7 }
      - { min-level: 18, slots: 8 }
      - { min-level: 20, slots: 10 }
    assignment-penalty-xp: 2000
    expiry-sweep-interval: PT5M

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
campusquest:
  security:
    jwt:
      allow-ephemeral-keys: true
    refresh-token:
      cookie-secure: false
    verification:
      pepper: ${VERIFICATION_PEPPER:dev-only-pepper-change-me-0123456789abcdef}
  dev:
    seed: true

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
